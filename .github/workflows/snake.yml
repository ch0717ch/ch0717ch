name: 잔디 뱀 생성

# 기여 그래프를 먹고 다니는 뱀 SVG 를 만들어 output 브랜치에 올린다.
# 외부 서비스에 의존하지 않고 이 저장소 안에서 생성되므로 이미지가 깨질 일이 없다.

on:
  schedule:
    # 매일 00:30 UTC (한국 시간 09:30)
    - cron: '30 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 뱀 SVG 생성
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
            dist/ocean.gif?color_snake=orange&color_dots=#bfd6f6,#8dbdff,#64a1f4,#4b91f1,#3c7dd9

      - name: output 브랜치에 올리기
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
